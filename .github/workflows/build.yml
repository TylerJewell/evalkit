name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: evalkit-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Test
        run: mvn -B -pl evalkit-core test

      # A dependency-free core is what lets a service in any language be
      # evaluated by implementing one interface, so it is asserted rather than
      # inferred from a green build.
      - name: Assert the compile classpath carries nothing
        run: |
          mvn -B -q -pl evalkit-core dependency:list -DincludeScope=compile \
            -DoutputFile=compile-deps.txt
          # A dependency line is a coordinate, so it carries colons. Matching on
          # indentation alone read the literal word "none" that dependency:list
          # prints for an empty list, and failed the build on the healthy case.
          if grep -qE '^ +[^ ]+:[^ ]+:[^ ]+:' evalkit-core/compile-deps.txt; then
            echo "evalkit-core has gained a compile dependency:"
            cat evalkit-core/compile-deps.txt
            exit 1
          fi

      # The check above can only pass by finding nothing, so it ships with a
      # case it is known to catch. Adding a real dependency to evalkit-core has
      # to fail the build, and this proves the pattern that decides it does.
      - name: Prove the assertion catches a dependency
        run: |
          printf '\nThe following files have been resolved:\n   none\n\n' > clean.txt
          printf '\nThe following files have been resolved:\n   org.slf4j:slf4j-api:jar:2.0.13:compile\n\n' > dirty.txt
          if grep -qE '^ +[^ ]+:[^ ]+:[^ ]+:' clean.txt; then
            echo "the pattern rejects an empty dependency list"; exit 1
          fi
          if ! grep -qE '^ +[^ ]+:[^ ]+:[^ ]+:' dirty.txt; then
            echo "the pattern misses a real dependency"; exit 1
          fi

  akka:
    name: evalkit-akka
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # The Akka SDK is not published to Maven Central. A developer gets it from
      # a per-account repository that `/akka:setup` writes into ~/.m2/settings.xml,
      # so this module builds only where that URL is available. Without the
      # secret the job reports what is missing instead of failing on a
      # dependency nobody outside can resolve.
      - name: Check for Akka repository access
        id: access
        env:
          AKKA_MAVEN_REPO_URL: ${{ secrets.AKKA_MAVEN_REPO_URL }}
        run: |
          if [ -n "$AKKA_MAVEN_REPO_URL" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AKKA_MAVEN_REPO_URL is not set, so evalkit-akka was not built. evalkit-core is covered by its own job."
          fi

      - name: Configure the Akka repository
        if: steps.access.outputs.available == 'true'
        env:
          AKKA_MAVEN_REPO_URL: ${{ secrets.AKKA_MAVEN_REPO_URL }}
        run: |
          mkdir -p ~/.m2
          # Written by the shell rather than by an echo of the URL, so the
          # credential in the path never reaches the log.
          cat > ~/.m2/settings.xml <<'XML'
          <settings>
            <profiles>
              <profile>
                <id>akka</id>
                <repositories>
                  <repository><id>akka</id><url>AKKA_URL</url></repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository><id>akka</id><url>AKKA_URL</url></pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            <activeProfiles><activeProfile>akka</activeProfile></activeProfiles>
          </settings>
          XML
          python3 - <<'PY'
          import os, pathlib
          p = pathlib.Path.home() / '.m2' / 'settings.xml'
          p.write_text(p.read_text().replace('AKKA_URL', os.environ['AKKA_MAVEN_REPO_URL']))
          PY

      - name: Build and test
        if: steps.access.outputs.available == 'true'
        run: mvn -B install

  prose:
    name: prose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Audit prose
        # conventions/prose.md quotes every construction it bans and opts itself
        # out with a marker, so passing it here would report its own examples.
        run: |
          python tools/audit-prose.py \
            docs/specs/*.html docs/site/evalkit/*.html.md README.md AGENTS.md \
            CONTRIBUTING.md SECURITY.md CHANGELOG.md

      - name: Compare the rule bank against the rules file
        run: python tools/audit-prose.py --check-drift
