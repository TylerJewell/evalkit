name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: evalkit-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # evalkit-core depends on akka-javasdk, which is not published to Maven
      # Central. Both modules now need the per-account repository the Akka
      # Specify plugin writes into ~/.m2/settings.xml, so a pull request from a
      # fork builds neither until the SDK ships.
      #
      # Checked before Java is installed, because setting up the Maven cache in
      # a job that goes on to skip its build warns that the path it was told to
      # cache does not exist.
      - name: Check for Akka repository access
        id: access
        env:
          AKKA_MAVEN_REPO_URL: ${{ secrets.AKKA_MAVEN_REPO_URL }}
        run: |
          if [ -n "$AKKA_MAVEN_REPO_URL" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AKKA_MAVEN_REPO_URL is not set, so evalkit-core was not built."
          fi

      - uses: actions/setup-java@v5
        if: steps.access.outputs.available == 'true'
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Configure the Akka repository
        if: steps.access.outputs.available == 'true'
        env:
          AKKA_MAVEN_REPO_URL: ${{ secrets.AKKA_MAVEN_REPO_URL }}
        run: |
          mkdir -p ~/.m2
          # Written by the shell rather than by an echo of the URL, so the
          # credential in the path never reaches the log.
          cat > ~/.m2/settings.xml <<'XML'
          <settings>
            <profiles>
              <profile>
                <id>akka</id>
                <repositories>
                  <repository><id>akka</id><url>AKKA_URL</url></repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository><id>akka</id><url>AKKA_URL</url></pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            <activeProfiles><activeProfile>akka</activeProfile></activeProfiles>
          </settings>
          XML
          python3 - <<'PY'
          import os, pathlib
          p = pathlib.Path.home() / '.m2' / 'settings.xml'
          p.write_text(p.read_text().replace('AKKA_URL', os.environ['AKKA_MAVEN_REPO_URL']))
          PY

      # Built from the module and not with -pl from the root. Maven reads every
      # module POM in the aggregator before it honours -pl, and evalkit-akka
      # inherits an SDK parent whose plugins pull more than this job needs.
      - name: Test
        if: steps.access.outputs.available == 'true'
        run: mvn -B -f evalkit-core/pom.xml test

  akka:
    name: evalkit-akka
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The Akka SDK is not published to Maven Central. A developer installs the
      # Akka Specify plugin and runs /akka:setup, which writes a per-account
      # repository into ~/.m2/settings.xml, so this module builds only where
      # that URL is available. Without the secret the job reports what is
      # missing instead of failing on a dependency nobody outside can resolve.
      #
      # Checked before Java is installed, because setting up the Maven cache in
      # a job that goes on to skip its build warns that the path it was told to
      # cache does not exist.
      - name: Check for Akka repository access
        id: access
        env:
          AKKA_MAVEN_REPO_URL: ${{ secrets.AKKA_MAVEN_REPO_URL }}
        run: |
          if [ -n "$AKKA_MAVEN_REPO_URL" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AKKA_MAVEN_REPO_URL is not set, so evalkit-akka was not built. evalkit-core is covered by its own job."
          fi

      - uses: actions/setup-java@v5
        if: steps.access.outputs.available == 'true'
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Configure the Akka repository
        if: steps.access.outputs.available == 'true'
        env:
          AKKA_MAVEN_REPO_URL: ${{ secrets.AKKA_MAVEN_REPO_URL }}
        run: |
          mkdir -p ~/.m2
          # Written by the shell rather than by an echo of the URL, so the
          # credential in the path never reaches the log.
          cat > ~/.m2/settings.xml <<'XML'
          <settings>
            <profiles>
              <profile>
                <id>akka</id>
                <repositories>
                  <repository><id>akka</id><url>AKKA_URL</url></repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository><id>akka</id><url>AKKA_URL</url></pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            <activeProfiles><activeProfile>akka</activeProfile></activeProfiles>
          </settings>
          XML
          python3 - <<'PY'
          import os, pathlib
          p = pathlib.Path.home() / '.m2' / 'settings.xml'
          p.write_text(p.read_text().replace('AKKA_URL', os.environ['AKKA_MAVEN_REPO_URL']))
          PY

      - name: Build and test
        if: steps.access.outputs.available == 'true'
        run: mvn -B install

  prose:
    name: prose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Audit prose
        # conventions/prose.md quotes every construction it bans and opts itself
        # out with a marker, so passing it here would report its own examples.
        run: |
          python tools/audit-prose.py \
            docs/specs/*.html docs/site/evalkit/*.html.md README.md AGENTS.md \
            CONTRIBUTING.md SECURITY.md CHANGELOG.md

      # Every rule in the bank passes by finding nothing, so a pattern that stops
      # matching is indistinguishable from prose that improved. Each rule ships
      # with a line it is known to catch, and tools/prose-fixtures.md also holds
      # wording that has to stay clean, which fails a rule widened past its shape.
      - name: Prove every rule still catches its fixture
        run: python tools/audit-prose.py --self-test

      - name: Compare the rule bank against the rules file
        run: python tools/audit-prose.py --check-drift
