# evalkit is a library; this config exists so the judge can be pointed at a real
# model for calibration runs. Ordinary `mvn test` never reaches it — those tests
# register a TestModelProvider and never call out.
#
# The judge model is a variable in every comparison it produces. The reference datasets
# were scored with "GPT 5.5 or equivalent"; scoring the same transcripts here with
# Gemini measures the rubric's portability across models as well as this
# implementation of it. Whichever model is used, it belongs in the report.
akka.javasdk.agent.model-provider = googleai-gemini

akka.javasdk.agent.googleai-gemini {
  model-name = "gemini-2.5-flash"
  # Judging should be as close to reproducible as the provider allows. The default
  # is warmer, which would make a re-run of the same sample disagree with itself
  # and be indistinguishable from a real change.
  temperature = 0.0
}
